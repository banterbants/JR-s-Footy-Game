<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { GameRenderer } from './src/gfx/renderer.js';
import { Match } from './src/sim/match.js';
import { TEAMS } from './src/config.js';
const q = new URLSearchParams(location.search);
const r = new GameRenderer(document.getElementById('c'), { antialias: true, shadows: q.get('sh') === '1', maxDpr: 2 });
const m = new Match({ home: TEAMS[+(q.get('h') || 0)], away: TEAMS[+(q.get('a') || 4)], humanTeam: q.get('human') ? 0 : -1, seed: +(q.get('seed') || 5), quarterLen: 180 });
r.setMatch(m, q.get('tod') || 'day');
r.camMode = q.get('cam') || 'broadcast';
window.m = m; window.r = r; if (q.get('D')) r.camD = +q.get('D'); if (q.get('H')) r.camH = +q.get('H');
const warm = +(q.get('warm') || 0);
for (let i = 0; i < warm * 60; i++) { m.step(1/60, null); m.events.length = 0; }
r.cut();
let last = performance.now();
window.frames = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!window.paused) { m.step(dt, null); if (m.phase === 'quarter') m.nextQuarter(); }
  for (const e of m.events) { if (e.type === 'goal') { r.confetti(m.lastScore.end, [m.teams[e.team].def.c1, m.teams[e.team].def.c2]); r.stadium.cheer(3); } if (e.type === 'cut' || e.type === 'setup') r.cut(); }
  m.events.length = 0;
  r.update(dt, m, true); r.render(); window.frames++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => r.resize());
</script></body></html>
